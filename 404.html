<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit</title></head><body><p>正在打开工作空间…</p><script>const base="/orbit-monorepo-demo/";const path=location.pathname;const mounts=["apps/orders/","admin/","chat/"];const mount=mounts.find(m=>path.startsWith(base+m))||'';fetch(base+mount+'index.html').then(r=>{if(!r.ok)throw Error();return r.text()}).then(html=>{document.open();document.write(html);document.close()}).catch(()=>{document.body.textContent='页面暂时无法打开，请返回工作空间重试。';});</script></body></html>
