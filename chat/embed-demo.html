<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>普通网页 · 客服嵌入演示</title>
    <link rel="stylesheet" href="./brand-tokens.css" />
    <style>
      body {
        margin: 0;
        background: var(--orbit-color-page);
        color: var(--orbit-color-text);
        font-family: var(--orbit-font-family);
      }
      main {
        max-width: 820px;
        margin: 10vh auto;
        padding: 30px;
      }
      small {
        letter-spacing: 3px;
        color: var(--orbit-color-text-muted);
      }
      h1 {
        font-size: 48px;
        line-height: 1.4;
        max-width: 600px;
      }
      p {
        line-height: 1.9;
        color: var(--orbit-color-text-secondary);
      }
      pre {
        background: var(--orbit-color-surface);
        border: 1px solid var(--orbit-color-border);
        padding: 24px;
        border-radius: var(--orbit-radius-card);
        overflow: auto;
        font-size: 13px;
      }
      a {
        color: var(--orbit-color-brand);
      }
      @media (max-width: 600px) {
        h1 {
          font-size: 32px;
        }
        main {
          margin: 4vh auto;
          padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <small>INDEPENDENT EMBED DEMO</small>
      <h1>这是一个普通 HTML 页面。</h1>
      <p>
        没有 React，没有主应用，也没有业务子应用依赖。<br />右下角的客服窗口由独立脚本加载，聊天内容运行在隔离的
        iframe 中。
      </p>
      <pre>
&lt;script src="https://chat.example.com/chat-embed.js"
  data-widget-url="https://chat.example.com/"
  data-mode="mock" defer&gt;&lt;/script&gt;</pre>
      <p><a href="./">返回聊天窗独立预览 ↗</a></p>
    </main>
    <script src="./chat-embed.js" data-mode="mock" defer></script>
  </body>
</html>
